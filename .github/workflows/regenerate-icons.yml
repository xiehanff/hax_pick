name: Regenerate macOS icons

on:
  push:
    branches:
      - fix/macos-icon-pipeline

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Generate derived icon files
        run: bash scripts/generate_macos_icons.sh hax_pick

      - name: Commit regenerated icons
        run: |
          if git diff --quiet -- hax_pick/AppIcon.icns hax_pick/MenuBarIcon.png hax_pick/MenuBarIcon@2x.png; then
            echo "Derived icons already match assets/app-icon.png"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hax_pick/AppIcon.icns hax_pick/MenuBarIcon.png hax_pick/MenuBarIcon@2x.png
          git commit -m "assets: regenerate macOS icons [skip ci]"
          git push
