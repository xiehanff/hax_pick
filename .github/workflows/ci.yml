name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify macOS icon assets
        run: |
          bash scripts/generate_macos_icons.sh hax_pick
          git diff --exit-code -- \
            hax_pick/AppIcon.icns \
            hax_pick/MenuBarIcon.png \
            hax_pick/MenuBarIcon@2x.png

      - name: Run Swift tests
        run: swift test

      - name: Build macOS app
        run: |
          xcodebuild \
            -project hax_pick.xcodeproj \
            -scheme hax_pick \
            -configuration Release \
            -destination 'platform=macOS' \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/haxpick-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify built app icon bundle
        run: |
          APP="$RUNNER_TEMP/haxpick-build/hax_pick.app"
          PLIST="$APP/Contents/Info.plist"
          RESOURCES="$APP/Contents/Resources"

          test -d "$APP"
          test -f "$RESOURCES/AppIcon.icns"
          test -f "$RESOURCES/MenuBarIcon.png"
          test -f "$RESOURCES/MenuBarIcon@2x.png"

          test "$(plutil -extract CFBundleName raw -o - "$PLIST")" = "HaxPick"
          test "$(plutil -extract CFBundleDisplayName raw -o - "$PLIST")" = "HaxPick"
          test "$(plutil -extract CFBundleIconFile raw -o - "$PLIST")" = "AppIcon.icns"

          test "$(sips -g pixelWidth "$RESOURCES/MenuBarIcon.png" | awk '/pixelWidth/ {print $2}')" = "16"
          test "$(sips -g pixelHeight "$RESOURCES/MenuBarIcon.png" | awk '/pixelHeight/ {print $2}')" = "16"
          test "$(sips -g pixelWidth "$RESOURCES/MenuBarIcon@2x.png" | awk '/pixelWidth/ {print $2}')" = "32"
          test "$(sips -g pixelHeight "$RESOURCES/MenuBarIcon@2x.png" | awk '/pixelHeight/ {print $2}')" = "32"

      - name: Package macOS app
        run: |
          PACKAGE_SUFFIX="${GITHUB_REF_NAME//\//-}"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/haxpick-build/hax_pick.app" \
            "$RUNNER_TEMP/HaxPick-${PACKAGE_SUFFIX}-macOS.zip"

      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: hax-pick-macos-${{ github.run_number }}
          path: ${{ runner.temp }}/HaxPick-*-macOS.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: hax-pick-macos-${{ github.run_number }}
          path: dist

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > RELEASE_NOTES.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          elif [ -s RELEASE_NOTES.md ]; then
            gh release create "$RELEASE_TAG" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          else
            gh release create "$RELEASE_TAG" dist/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --verify-tag
          fi
