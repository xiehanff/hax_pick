name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/ai-session-v2

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Swift tests
        run: swift test

      - name: Build macOS app
        run: |
          xcodebuild \
            -project hax_pick.xcodeproj \
            -scheme hax_pick \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
